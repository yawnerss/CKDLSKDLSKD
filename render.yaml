services:
  - type: web
    name: cloudflare-solver-api
    runtime: image  # Use Docker instead of native Python
    repo: https://github.com/yawnerss/CKDLSKDLSKD/ # replace with your repo URL
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      # Optional: increase timeout for long challenges
      - key: UVICORN_TIMEOUT
        value: 120
