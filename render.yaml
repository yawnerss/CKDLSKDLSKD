services:
  - type: web
    name: cloudflare-solver-api
    runtime: python
    runtimeVersion: '3.12'
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements.txt
    startCommand: uvicorn cf_api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
